name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # release-please reads the conventional commits since the last tag,
  # keeps a release PR up to date, and on merge creates the tag, the
  # GitHub release and the CHANGELOG entry.
  #
  # It uses the built-in GITHUB_TOKEN rather than a personal one. That
  # choice came from looking at the token actually to hand: in the
  # environment this was set up from, `gh auth token` returned an OAuth
  # token carrying repo, workflow and delete_repo across every
  # repository that user can reach, and storing that in a public
  # repository's secrets would grant far more than releasing this one.
  # (gh can also be logged in with a PAT, so what it returns depends on
  # the environment -- but a token scoped tightly enough to be worth
  # storing has to be minted and rotated by hand.)
  #
  # The cost is paid on the release PR this opens: because GITHUB_TOKEN
  # raised the event, its pull_request opened/synchronize runs are
  # created in the approval-required state rather than started, so CI
  # and commitlint wait until someone with write access presses
  # "Approve workflows to run". Do that before merging, or the one PR
  # that changes the version ships unchecked.
  #
  # This also needs "Allow GitHub Actions to create and approve pull
  # requests" enabled in the repository settings; it is off by default
  # on a new personal repository, and release-please cannot open the PR
  # without it. See the release section of the README.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Attaches binaries to the release release-please just made. The
  # goreleaser config uses `release: mode: keep-existing` so the notes
  # written from the commits are left alone.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
