name: Publish container image

on:
  workflow_call:
    inputs:
      tag:
        description: Git release tag to build
        required: true
        type: string
      publish_latest:
        description: Also point latest at this release
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git release tag to build (for example v0.4.0)
        required: true
        type: string
      publish_latest:
        description: Also move latest to this tag
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release tag such as v0.4.0"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'tags<<EOF\n%s:%s\n' "$image" "$TAG" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH_LATEST" = true ]; then
            printf '%s:latest\n' "$image" >> "$GITHUB_OUTPUT"
          fi
          printf 'EOF\n' >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}

      - name: Verify published platforms
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG" > image-manifest.txt
          grep -q 'linux/amd64' image-manifest.txt
          grep -q 'linux/arm64' image-manifest.txt

      - name: Verify binaries start
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          for arch in amd64 arm64; do
            got="$(docker run --rm --platform "linux/$arch" "$IMAGE:$TAG" --version)"
            [ "$got" = "rh-sc-mcp ${TAG#v}" ] || {
              echo "::error::linux/$arch reported an unexpected version"
              exit 1
            }
          done
