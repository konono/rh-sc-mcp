# rh-sc-mcp configuration example
#
# offline token だけが必須で、それ以外のキーはすべて省略可能です (省略時は
# 下記に書かれた既定値)。offline token も、環境変数 $RH_SC_OFFLINE_TOKEN で
# 渡すならこのファイルには書かなくて構いません。どちらにも無い場合は起動時に
# エラーになります。
#
# 不明なキーがあると起動時にエラーになります (permisson のような綴り間違いを
# 黙って無視しないため)。
#
# 設定ファイルの既定パスは ~/.config/rh-sc-mcp/config.yaml です。
# 初回起動時に最小構成のファイルが自動生成されます。全キーを確認したい場合は
# この例を参照してください。既存の設定ファイルをコピーで上書きしないでください。
# 実運用のファイルは offline token を含みうるため、リポジトリ内に置かず
# 適切な権限で管理してください。

# ---------------------------------------------------------------------------
# 認証
# ---------------------------------------------------------------------------

# Red Hat API offline token。
# 環境変数 $RH_SC_OFFLINE_TOKEN のほうが優先されます。secret store から渡せる
# ので、可能なら環境変数を使い、このキーは書かないでください。
# offlineToken: "eyJhbGciOi..."

# SSO のトークン交換先。既定値は下記のとおりで、通常は変更不要です。
# ssoTokenURL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
# ssoClientID: rhsm-api

# ---------------------------------------------------------------------------
# エンドポイント
# ---------------------------------------------------------------------------

# 公開 API 仕様 (Swagger 2.0, host api.access.redhat.com, basePath /support)
# の既定値。別環境を向ける場合のみ変更します。既定以外にすると起動時に警告が
# 出ます (レスポンス形状が保証されるのは公開エンドポイントだけのため)。
# baseURL: https://api.access.redhat.com/support

# ケース API のメジャーバージョン。v3 が現行で、本サーバーが検証している唯一の
# バージョンです。v1 も仕様書に存在するため設定可能にしていますが、形状差異は
# 検証していません。
# apiVersion: v3

# 人間向けリンクを組み立てるコンソール URL の接頭辞 (任意)。
# ケース番号が最後のパスセグメントとして連結されます。
#   caseViewURL: https://example.invalid/cases
#   → caseUrl: https://example.invalid/cases/04337263
#
# 既定値はありません。公開 API 仕様は Web コンソールの URL 体系について何も
# 述べていないため、既定値を置くとこのサーバーが「確認していないリンク」を
# 事実として提示することになります。未設定のときツール出力に caseUrl は
# 現れず、API 自身が返した uri / location だけが返ります。
# caseViewURL: ""

# ---------------------------------------------------------------------------
# 権限 (operator が決める。モデルは変更できない)
# ---------------------------------------------------------------------------

# 全体キルスイッチ。true の間は、個別の write 付与があっても read に丸められる。
# 省略時は true (= 既定 read-only)。環境変数 $RH_SC_READ_ONLY でも上書き可能。
readOnly: true

# resources に明示がないリソースの既定値。
# 省略時はリソースごとの既定 (case/comment = read, kcs = none) が使われます。
# defaultPermission: read

resources:
  # ケース本体の参照・作成・更新
  case:
    permission: read
  # ケースコメントの参照・投稿。
  # case と分けてあるので「返信はさせるが、ステータスや severity は変えさせない」
  # という構成が書けます (comment: write + case: read)。
  comment:
    permission: read
  # ナレッジベース検索。ケース管理とは別の API 面なので、明示的に書かない限り
  # 有効になりません (defaultPermission を write にしても none のまま)。
  # kcs:
  #   permission: read

# ---------------------------------------------------------------------------
# 応答サイズと timeout
# ---------------------------------------------------------------------------

# 1 回の検索が返すケース数の上限 (API 側の上限は 200)。
maxResults: 50

# コメント一覧が返す件数の上限。コメント API には件数パラメータがないため、
# レスポンス受信後にこちら側で切り詰め、切り詰めた旨をツール出力に書きます。
maxComments: 50

# 1 回の上流 HTTP 呼び出しの制限時間 (秒)。
timeoutSeconds: 60

# ---------------------------------------------------------------------------
# Streamable HTTP トランスポート (既定 OFF)
# ---------------------------------------------------------------------------

# addr を設定すると stdio ではなく HTTP で待ち受けます。設定しなければ
# stdio のままです。
#
# HTTP を使う場合は共有 bearer token が必須で、offline token と同じ文字列は
# 使えません (どちらも起動時にエラーになります)。設定項目の一覧と意味は
# examples/http-server.yaml を参照してください。
#
# http:
#   addr: ":8080"
#   # token は $RH_SC_MCP_HTTP_TOKEN から渡すのを推奨。生成:
#   #   openssl rand -hex 32
#   stateless: true
#   trustedOrigins: []

# ---------------------------------------------------------------------------
# 書き込みを許可する場合の例 (コメント投稿だけ許可する構成)
# ---------------------------------------------------------------------------
#
# readOnly: false
# resources:
#   case:
#     permission: read
#   comment:
#     permission: write
#
# 書き込みが有効な構成では起動時に stderr へ警告が出ます。投稿したコメントは
# Red Hat サポートとアカウント上の全員に見え、取り消せません。
