# rh-sc-mcp configuration example
#
# The offline token is the only required setting; every other key is optional
# and falls back to the default noted below. Even the offline token can be left
# out of this file if you pass it through the environment variable
# $RH_SC_OFFLINE_TOKEN. If it is in neither place, startup fails with an error.
#
# An unknown key is a startup error (so that a typo like "permisson" is not
# silently ignored).
#
# The default path of the configuration file is ~/.config/rh-sc-mcp/config.yaml.
# A minimal file is generated automatically on the first run. Consult this
# example when you want to see every key. Do not overwrite an existing
# configuration file with a copy of this one. A real file may contain the
# offline token, so keep it out of the repository and with suitable permissions.

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------

# Red Hat API offline token.
# The environment variable $RH_SC_OFFLINE_TOKEN takes precedence. It can be fed
# from a secret store, so prefer the environment variable and leave this key out.
# offlineToken: "eyJhbGciOi..."

# SSO token exchange endpoint. The defaults are below and rarely need changing.
# ssoTokenURL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
# ssoClientID: rhsm-api

# ---------------------------------------------------------------------------
# Endpoint
# ---------------------------------------------------------------------------

# Default from the published API specification (Swagger 2.0, host
# api.access.redhat.com, basePath /support). Change it only to point at another
# environment. A non-default value produces a startup warning, because the
# response shapes are only guaranteed for the public endpoint.
# baseURL: https://api.access.redhat.com/support

# Major version of the case API. v3 is current and the only version this server
# has verified. v1 also exists in the specification so it is configurable, but
# the differences in shape have not been verified.
# apiVersion: v3

# Optional prefix of the console URL used to build human-facing links.
# The case number is appended as the last path segment.
#   caseViewURL: https://example.invalid/cases
#   → caseUrl: https://example.invalid/cases/04337263
#
# There is no default. The published API specification says nothing about the
# web console's URL scheme, so a default would make this server present a link
# it has never verified as if it were fact. When unset, caseUrl does not appear
# in tool output; you get only the uri / location the API itself returned.
# caseViewURL: ""

# ---------------------------------------------------------------------------
# Permissions (decided by the operator; the model cannot change them)
# ---------------------------------------------------------------------------

# Global kill switch. While true, any individually granted write is reduced to
# read. Defaults to true (i.e. read-only by default). Can also be overridden
# with the environment variable $RH_SC_READ_ONLY.
readOnly: true

# Default for resources not named under "resources".
# When omitted, the per-resource defaults apply (case/comment = read, kcs = none).
# defaultPermission: read

resources:
  # Reading, creating and updating cases themselves
  case:
    permission: read
  # Reading and posting case comments.
  # Kept separate from case, so you can express "let it reply, but don't let it
  # change status or severity" (comment: write + case: read).
  comment:
    permission: read
  # Knowledge base search. It is a different API surface from case management,
  # so it is never enabled unless written explicitly (even defaultPermission:
  # write leaves it at none).
  # kcs:
  #   permission: read

# ---------------------------------------------------------------------------
# Response size and timeout
# ---------------------------------------------------------------------------

# Maximum number of cases one search returns (the API's own cap is 200).
maxResults: 50

# Maximum number of comments a listing returns. The comments API has no count
# parameter, so truncation happens on this side after the response arrives, and
# the fact that it was truncated is stated in the tool output.
maxComments: 50

# Time limit for a single upstream HTTP call, in seconds.
timeoutSeconds: 60

# ---------------------------------------------------------------------------
# Streamable HTTP transport (off by default)
# ---------------------------------------------------------------------------

# Setting addr makes the server listen over HTTP instead of stdio. Leave it
# unset and it stays on stdio.
#
# Using HTTP requires a shared bearer token, and it may not be the same string
# as the offline token (either mistake is a startup error). For the full list of
# settings and what they mean, see examples/http-server.yaml.
#
# http:
#   addr: ":8080"
#   # Prefer passing the token via $RH_SC_MCP_HTTP_TOKEN. Generate one with:
#   #   openssl rand -hex 32
#   stateless: true
#   trustedOrigins: []

# ---------------------------------------------------------------------------
# Example of allowing writes (a setup that only permits posting comments)
# ---------------------------------------------------------------------------
#
# readOnly: false
# resources:
#   case:
#     permission: read
#   comment:
#     permission: write
#
# A write-capable configuration prints a warning to stderr at startup. A posted
# comment is visible to Red Hat support and to everyone on the account, and it
# cannot be withdrawn.
