# Example configuration for sharing the server over HTTP.
#
# Unlike stdio, there is no OS gate in front of an open port. A bearer token is
# therefore mandatory, and anyone who can present it gets everything the scope
# allows. Terminate TLS in front of this server (the token rides in a header on
# every request, so plaintext HTTP hands it to anyone on the path).

# The offline token comes from $RH_SC_OFFLINE_TOKEN. Do not write it here.

http:
  addr: ":8080"
  # Shared bearer token. $RH_SC_MCP_HTTP_TOKEN is recommended, since it can be
  # fed from a secret store. Generate one with: openssl rand -hex 32
  #
  # It may not be the same string as the offline token (that is a startup
  # error). If they were identical, the token handed to every MCP client would
  # be the Red Hat credential itself, letting clients bypass this server's scope.
  # token: xxxxx

  # Defaults to true, so that multiple replicas can sit behind one Service
  # without sticky routing. Set it to false only for a single instance that
  # needs server-initiated messages.
  stateless: true

  # Only meaningful when stateful (stateless: false).
  # sessionTimeoutSeconds: 300

  # Extra origins allowed by the cross-origin check. Browsers are not an
  # expected client, so this is normally empty.
  trustedOrigins: []

# Keeps the read-only default. To allow writes, set readOnly to false and then
# grant write individually under resources.
readOnly: true

resources:
  case:
    permission: read
  comment:
    permission: read
  # Knowledge base search is a separate API surface, so enable it explicitly.
  # kcs:
  #   permission: read

maxResults: 50
maxComments: 50
timeoutSeconds: 60
