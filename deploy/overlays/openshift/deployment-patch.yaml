apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-sc-mcp
spec:
  template:
    spec:
      securityContext:
        # OpenShift's restricted-v2 SCC assigns a UID from the
        # namespace's range and rejects a pod that pins one. Dropping
        # runAsUser lets it choose; the image writes no files, so any
        # UID works.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
