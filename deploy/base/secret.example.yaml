# Template only. Do not commit a filled-in copy of this file.
#
#   kubectl create secret generic rh-sc-mcp \
#     --from-literal=offlineToken="$RH_SC_OFFLINE_TOKEN" \
#     --from-literal=httpToken="$(openssl rand -hex 32)"
#
apiVersion: v1
kind: Secret
metadata:
  name: rh-sc-mcp
type: Opaque
stringData:
  # Issue at https://access.redhat.com/management/api. This server can
  # only narrow what the token may do, never widen it, so the account's
  # own Red Hat permissions are the real boundary.
  offlineToken: REPLACE_ME
  # Shared bearer token every MCP client must present. It must be a
  # different string from offlineToken — the server refuses to start if
  # they match, because a client holding the offline token could reach
  # the support API directly, outside this server's scope.
  httpToken: REPLACE_ME
